[project]
name = "backend"
version = "0.1.0"
description = "Natural language photo editing recipe API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "laya>=0.4.1",
    "pydantic>=2.10.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
